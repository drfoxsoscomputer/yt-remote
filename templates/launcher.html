<!doctype html>
<html lang="es" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT-Remote · Conectar</title>
<link rel="stylesheet" href="/static/css/tailwind.css">
<link rel="stylesheet" href="/static/css/tema.css">
<style>
  /* Critical CSS: primera pintura ya centrada v+h y con fondo del tema */
  html, body { height: 100%; margin: 0; }
  body {
    background: #1a1a2e;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    box-sizing: border-box;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  /* Menú contextual propio (WebView2 no tiene uno nativo) */
  #ctx-menu {
    position: fixed;
    z-index: 999;
    display: none;
    min-width: 160px;
    background: #262640;
    border: 1px solid #3f3f5a;
    border-radius: 0.6rem;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    padding: 0.25rem;
  }
  #ctx-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 0.5rem 0.75rem;
    border: none;
    border-radius: 0.4rem;
    background: transparent;
    color: #e8e8e8;
    font-size: 0.875rem;
    cursor: pointer;
  }
  #ctx-menu button:hover { background: #3f3f5a; }
</style>
</head>
<body class="bg-fondo text-texto min-h-screen antialiased flex flex-col items-center justify-center px-4">

  <div class="mb-2">
    <img src="/static/img/logo-ytremote.png" alt="YT-Remote"
         class="w-20 h-20 mx-auto object-contain">
  </div>

  <h1 class="text-2xl font-bold text-texto text-center mb-1">YT-Remote</h1>
  <p class="text-zinc-400 text-sm mb-4 text-center">Control remoto de YouTube para Telegram</p>

  <div id="form-container" class="w-full max-w-sm space-y-4">

    <!-- Vista principal: estado del bot -->
    <div id="vista-estado" class="bg-panel rounded-2xl p-5 border border-borde text-center">
      <div class="flex items-center justify-center gap-2 mb-3">
        <span id="estado-dot" style="display:inline-block;width:0.7rem;height:0.7rem;border-radius:50%;background:#e8e8e8;"></span>
        <h2 id="estado-titulo" class="text-xl font-bold text-texto">Cargando...</h2>
      </div>
      <p id="estado-detalle" class="text-texto-dim mb-5 min-h-[1.25rem] text-sm"></p>

      <div class="flex flex-col gap-3">
        <button type="button" id="btn-start-session"
                class="btn-primario w-full py-3 rounded-xl font-semibold transition">Iniciar sesión</button>
        <button type="button" id="btn-connect"
                class="btn-primario w-full py-3 rounded-xl font-semibold transition hidden">Conectar</button>
        <button type="button" id="btn-stop"
                class="btn-secundario w-full py-3 rounded-xl font-semibold transition hidden">Detener</button>
        <div class="flex gap-3">
          <button type="button" id="btn-settings"
                  class="btn-secundario flex-1 py-3 rounded-xl font-semibold transition hidden">Configurar</button>
          <button type="button" id="btn-exit"
                  class="btn-secundario flex-1 py-3 rounded-xl font-semibold transition">Salir</button>
        </div>
        <button type="button" id="btn-logout"
                class="btn-peligro w-full py-3 rounded-xl font-semibold transition hidden">Cerrar sesión</button>
      </div>
    </div>

    <!-- Vista formulario: iniciar sesión / configurar datos -->
    <div id="vista-form" class="hidden bg-panel rounded-2xl p-5 border border-borde">
      <div class="mb-3">
        <label class="block text-sm font-medium text-texto-dim mb-2">Token del bot</label>
        <div class="relative">
          <input type="password" id="bot_token" autocomplete="new-password"
                 class="w-full bg-input border border-borde rounded-xl px-4 py-3 text-texto placeholder-texto-dim
                        focus:outline-none focus:ring-2 focus:ring-azul focus:border-transparent"
                 placeholder="123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11">
          <button type="button" id="toggle-token" aria-label="Mostrar/ocultar token"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-texto-dim hover:text-azul transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="mb-3">
        <label class="block text-sm font-medium text-texto-dim mb-2">Tu ID de Telegram (admin)</label>
        <div class="relative">
          <input type="password" id="admin_id" autocomplete="new-password"
                 class="w-full bg-input border border-borde rounded-xl px-4 py-3 text-texto placeholder-texto-dim
                        focus:outline-none focus:ring-2 focus:ring-azul focus:border-transparent"
                 placeholder="123456789">
          <button type="button" id="toggle-admin" aria-label="Mostrar/ocultar ID"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-texto-dim hover:text-azul transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-texto-dim mb-2">Expulsar usuarios tras horas (0 = off)</label>
        <input type="number" id="kick_hours" min="0" max="168" value="0"
               class="w-full bg-input border border-borde rounded-xl px-4 py-3 text-texto placeholder-texto-dim
                      focus:outline-none focus:ring-2 focus:ring-azul focus:border-transparent">
      </div>

      <div id="error-msg" class="hidden text-red-400 text-sm text-center mb-3 min-h-[1.25rem]"></div>

      <div class="flex flex-col gap-3">
        <button type="button" id="btn-save"
                class="btn-primario w-full py-3 rounded-xl font-semibold transition">Guardar</button>
        <div class="flex gap-3">
          <button type="button" id="btn-cancel"
                  class="btn-secundario flex-1 py-3 rounded-xl font-semibold transition">Cancelar</button>
          <button type="button" id="btn-form-exit"
                  class="btn-secundario flex-1 py-3 rounded-xl font-semibold transition">Salir</button>
        </div>
      </div>
    </div>

  </div>

  <p class="text-xs text-zinc-500 mt-5 text-center">Servidor local en puerto 8081</p>

  <div id="ctx-menu" role="menu">
    <button type="button" id="ctx-paste" role="menuitem">Pegar</button>
    <button type="button" id="ctx-copy" role="menuitem">Copiar</button>
  </div>

  <script src="/static/js/launcher.js"></script>
</body>
</html>
